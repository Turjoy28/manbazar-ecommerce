name: Deploy Admin to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'admin/**'
      - '.github/workflows/admin-deploy.yml'
  workflow_dispatch:

env:
  DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/var/www/manbazar' }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'admin/package-lock.json'

      - name: Install Dependencies
        run: |
          cd admin
          npm ci

      - name: Build Application
        run: |
          cd admin
          npm run build
        env:
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          known_hosts: 'unnecessary-placeholder'
          if_key_exists: replace

      - name: Adding Known Hosts
        run: ssh-keyscan -p ${{ secrets.VPS_PORT || 22 }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Debug Target Path and Permissions on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "Logged in user: \$(whoami)"
            echo "Target Deploy Path: '${{ env.DEPLOY_PATH }}'"
            echo "Checking if target path exists:"
            if [ -d "${{ env.DEPLOY_PATH }}" ]; then
              echo "Target directory exists."
              ls -la "${{ env.DEPLOY_PATH }}"
            else
              echo "Target directory does NOT exist!"
              mkdir -p "${{ env.DEPLOY_PATH }}" && echo "Created target directory." || echo "Failed to create target directory!"
            fi

      - name: Transfer Build Files
        run: |
          rsync -avz --delete --rsync-path="mkdir -p ${{ env.DEPLOY_PATH }}/admin/.next && rsync" -e "ssh -p ${{ secrets.VPS_PORT || 22 }}" \
            admin/.next/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.DEPLOY_PATH }}/admin/.next/
          
          rsync -avz --rsync-path="mkdir -p ${{ env.DEPLOY_PATH }}/admin/public && rsync" -e "ssh -p ${{ secrets.VPS_PORT || 22 }}" \
            admin/package.json \
            admin/package-lock.json \
            admin/next.config.ts \
            admin/public/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.DEPLOY_PATH }}/admin/
          
          rsync -avz --rsync-path="mkdir -p ${{ env.DEPLOY_PATH }} && rsync" -e "ssh -p ${{ secrets.VPS_PORT || 22 }}" \
            ecosystem.config.js \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.DEPLOY_PATH }}/

      - name: Post-Deploy Actions on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:~/bin:~/.npm-global/bin
            cd ${{ env.DEPLOY_PATH }}/admin
            npm ci --omit=dev
            cd ${{ env.DEPLOY_PATH }}
            pm2 reload ecosystem.config.js --only manbazar-admin || pm2 start ecosystem.config.js --only manbazar-admin
